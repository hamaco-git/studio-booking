{% if r.status == 'CONFIRMED' %}{% if r.needs_attendance %}<span class="badge text-bg-warning">처리 전</span>{% else %}<span class="badge text-bg-primary">확정</span>{% endif %}{% elif r.status == 'COMPLETED' %}<span class="badge text-bg-success">촬영 완료</span>{% elif r.status == 'NO_SHOW' %}<span class="badge text-bg-danger">불참(노쇼)</span>{% else %}<span class="badge text-bg-secondary">취소</span>{% if r.cancel_reason %}<div class="small text-secondary text-wrap">{{ r.cancel_reason }}</div>{% endif %}{% endif %}
