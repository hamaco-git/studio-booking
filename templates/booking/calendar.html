{% extends "base.html" %}
{% block title %}현황 달력 · 스튜디오 예약{% endblock %}
{% block content %}
<div class="d-flex flex-wrap align-items-center gap-2 mb-3">
  <h1 class="h4 m-0 me-auto">현황 달력</h1>
  <select id="studio" class="form-select w-auto" aria-label="스튜디오">
    <option value="">전체 스튜디오</option>
    {% for s in studios %}<option value="{{ s.pk }}" {% if selected == s.pk|stringformat:'s' %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
  </select>
</div>
<div class="d-flex flex-wrap gap-3 small mb-2">
  {% for s in studios %}<span><span class="d-inline-block rounded me-1" style="width:12px;height:12px;background:{{ s.color }}"></span>{{ s.code }} 예약</span>{% endfor %}
  <span><span class="d-inline-block rounded me-1" style="width:12px;height:12px;background:#d1f0dc;border:1px solid #7ccf9b"></span>예약 가능</span>
  <span><span class="d-inline-block rounded me-1" style="width:12px;height:12px;background:#f8d7da;border:1px solid #f1aeb5"></span>촬영 불가</span>
</div>
<div class="card shadow-sm"><div class="card-body"><div id="cal"></div></div></div>
<p class="text-secondary small mt-2">예약을 누르면 수정·취소 화면으로 이동합니다 (담당 스튜디오만).</p>
{% endblock %}
{% block scripts %}
<style>
  .fc a { color: inherit; text-decoration: none; }
  .fc .fc-event { cursor: default; font-size: .8rem; }
  .fc .fc-event.clickable { cursor: pointer; }
</style>
{% load static %}<script src="{% static 'vendor/fullcalendar.min.js' %}"></script>
<script src="{% static 'vendor/fullcalendar-ko.min.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const editable = new Set({{ editable_ids|safe }});
  const studioSel = document.getElementById('studio');
  const cal = new FullCalendar.Calendar(document.getElementById('cal'), {
    initialView: 'dayGridMonth',
    locale: 'ko',
    buttonText: {today: '오늘', month: '월', week: '주', list: '목록'},
    headerToolbar: {left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listWeek'},
    allDayText: '종일',
    noEventsContent: '일정이 없습니다',
    slotMinTime: '08:00:00', slotMaxTime: '20:00:00',
    height: 'auto',
    eventDisplay: 'block',
    views: {dayGridMonth: {displayEventTime: false}},
    dayMaxEvents: 4,
    moreLinkText: n => `+${n}개 더`,
    eventTimeFormat: {hour: '2-digit', minute: '2-digit', hour12: false},
    events: function (info, ok, fail) {
      const p = new URLSearchParams({start: info.startStr.slice(0, 10), end: info.endStr.slice(0, 10), studio: studioSel.value});
      fetch('{% url "booking:events" %}?' + p).then(r => r.json()).then(ok).catch(fail);
    },
    eventClassNames: function (arg) {
      const e = arg.event.extendedProps;
      return (e.kind === 'reservation' && editable.has(e.studio)) ? ['clickable'] : [];
    },
    eventClick: function (info) {
      const e = info.event.extendedProps;
      if (e.kind === 'reservation' && editable.has(e.studio)) {
        window.location = '{% url "booking:reservations" %}' + e.id + '/';
      }
    },
  });
  cal.render();
  studioSel.addEventListener('change', () => cal.refetchEvents());
});
</script>
{% endblock %}
