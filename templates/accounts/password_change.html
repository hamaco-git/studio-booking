{% extends "base.html" %}
{% block title %}비밀번호 변경 · 스튜디오 예약{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3">비밀번호 변경</h1>
      {% if user.must_change_password %}<div class="alert alert-warning">처음 로그인하셨습니다. 새 비밀번호를 정해 주세요.</div>{% endif %}
      <form method="post">{% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          <input class="form-control" type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" required>
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        </div>
        {% endfor %}
        <button class="btn btn-primary w-100">변경</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
