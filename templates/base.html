<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}스튜디오 예약{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-white border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">스튜디오 예약</a>
    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-3">
      <span class="text-secondary small">{{ user.name }} · {{ user.get_role_display }}</span>
      {% if user.is_super_admin %}<a class="btn btn-sm btn-outline-secondary" href="{% url 'admin:index' %}">관리자</a>{% endif %}
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'password_change' %}">비밀번호 변경</a>
      <form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}
        <button class="btn btn-sm btn-outline-danger">로그아웃</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container">
  {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
