# /etc/nginx/sites-available/studio-booking
server {
    listen 80;
    server_name studio.example.ac.kr;   # 실제 도메인으로 변경

    client_max_body_size 10m;

    location /static/ {
        alias /srv/studio-booking/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/studio-booking/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
